name: Probe the extract server

# Asks the extract server for a few files' headers from GitHub's network and keeps the answers beside the places data.
# For finding out why a places build could not fetch. Runs when a branch named probe/... is pushed.

on:
  push:
    branches: ['probe/**']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ask
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            date -u
            for u in north-america/us/delaware/delaware-latest.osm.pbf north-america/us/delaware/delaware-latest.osm.pbf.md5 north-america/canada/prince-edward-island/prince-edward-island-latest.osm.pbf north-america/us/puerto-rico/puerto-rico-latest.osm.pbf north-america/us/us-virgin-islands/us-virgin-islands-latest.osm.pbf north-america/mexico/mexico-latest.osm.pbf.md5; do
              echo "== HEAD $u"; curl -sS -I -L -m 40 -A "Wikivault places build (github.com/wwmotorsport/WikiVault)" "https://download.geofabrik.de/$u" 2>&1 | grep -i -E "^HTTP|^location|^content-length|curl:" | head -12
            done
            echo "== index"; curl -sS -L -m 60 -o index.json -w "%{http_code} %{size_download}\n" "https://download.geofabrik.de/index-v1-nogeom.json"
            node -e "const d=JSON.parse(require('fs').readFileSync('index.json','utf8'));const f=d.features.map(x=>x.properties);console.log(f.length,'regions');for(const id of ['us/delaware','us/north-carolina','us/puerto-rico','us/us-virgin-islands','canada/prince-edward-island','mexico','us/alaska','us/hawaii','us/district-of-columbia','us/california'])console.log(id,JSON.stringify((f.find(x=>x.id===id)||{}).urls&&f.find(x=>x.id===id).urls.pbf),(f.find(x=>x.id===id)||{}).parent);console.log(f.filter(x=>x.parent==='us'||x.parent==='north-america'||x.parent==='canada').map(x=>x.id).join(' '))"
          } 2>&1 | tee probe.txt
          gh release upload places-data probe.txt --clobber --repo "$GITHUB_REPOSITORY"
      - name: Remove the branch that asked for this
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/${GITHUB_REF#refs/heads/}" || true
