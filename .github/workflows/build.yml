# Builds the Windows installer on GitHub's own Windows machine.
# Runs when a version tag (v0.10.0, v0.10.1, ...) is pushed, or by hand from the Actions tab.
name: Build installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The download, search-ordering, tuning and model tests need nothing but Node.
      - run: node --test test/download.test.js test/parallel.test.js test/search.test.js test/tune.test.js
      - run: node scripts/make-notices.js
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Wikivault-Setup
          path: dist/Wikivault-Setup-*.exe
      - name: Attach the installer to the release for this tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Wikivault-Setup-*.exe
          generate_release_notes: false
          body: See CHANGELOG.md for what changed in this version.
