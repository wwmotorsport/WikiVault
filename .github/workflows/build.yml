# Builds the Windows installer on GitHub's own Windows machine and attaches it to the release.
# It runs in three ways:
#   - when a version tag is pushed (v0.26.1 or V0.26.1), which is what creating a release in the GitHub pages does;
#   - when a branch named release/<tag> is pushed (release/v0.26.1): the release and its tag are then made here,
#     at that branch's newest commit, and the branch is removed afterwards;
#   - by hand from the Actions tab: give it the tag of a release that already exists and it builds that version
#     and attaches the installer to it.
name: Build installer

on:
  push:
    tags: ['v*', 'V*']
    branches: ['release/v*', 'release/V*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release to build and attach the installer to. Leave empty to only build.
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Which release this build is for: the tag given by hand, the tag pushed, or the name after release/.
      - name: Work out the release
        shell: bash
        env:
          GIVEN_TAG: ${{ inputs.tag }}
        run: |
          tag="$GIVEN_TAG"
          if [ -z "$tag" ]; then
            case "$GITHUB_REF" in
              refs/tags/*) tag="${GITHUB_REF#refs/tags/}" ;;
              refs/heads/release/*) tag="${GITHUB_REF#refs/heads/release/}" ;;
            esac
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "release: ${tag:-none, build only}"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The download, search-ordering, tuning and model tests need nothing but Node.
      - run: node --test test/download.test.js test/parallel.test.js test/search.test.js test/tune.test.js test/download-link.test.js
      - run: node scripts/make-notices.js
      # The Java runtime the routing engine needs, checked against a pinned checksum.
      - run: node scripts/fetch-java.js
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Wikivault-Setup
          path: dist/Wikivault-Setup-*.exe
      # Only the installer is added. The release's title, notes and pre-release mark are left as written.
      - name: Attach the installer to the release
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release made here takes its notes from .github/RELEASE-NOTES.md, which is written for the version being tagged.
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # From a release/<tag> branch the tag does not exist yet: it is made with the release, at this commit.
            at="--verify-tag"
            case "$GITHUB_REF" in refs/heads/release/*) at="--target $GITHUB_SHA" ;; esac
            if [ -f .github/RELEASE-NOTES.md ]; then
              gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" $at --title "Wikivault ${RELEASE_TAG#[vV]}" --notes-file .github/RELEASE-NOTES.md
            else
              gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" $at --title "$RELEASE_TAG" --notes "See CHANGELOG.md for what changed in this version."
            fi
          fi
          gh release upload "$RELEASE_TAG" dist/Wikivault-Setup-*.exe --clobber --repo "$GITHUB_REPOSITORY"
      # Releases that have been withdrawn are named, one tag to a line, in .github/withdrawn-releases.txt.
      # They and their tags are removed here, after the new installer is in place, so that there is always one to download.
      - name: Remove withdrawn releases
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          list=".github/withdrawn-releases.txt"
          [ -f "$list" ] || exit 0
          while IFS= read -r line || [ -n "$line" ]; do
            tag="$(printf '%s' "${line%%#*}" | tr -d '[:space:]')"
            if [ -z "$tag" ] || [ "$tag" = "$RELEASE_TAG" ]; then continue; fi
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              echo "removed the release $tag"
            fi
            git push origin ":refs/tags/$tag" > /dev/null 2>&1 || true
          done < "$list"
      # The download links in the README, DOWNLOAD-INSTALLER.md and the user guide name one exact file.
      # Now that the file is on the release, point them at it, so they never name something that is not there.
      - name: Check out the main branch to update the download links
        if: env.RELEASE_TAG != ''
        uses: actions/checkout@v4
        with:
          ref: main
          path: _main
      - name: Point the download links at this release
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          installer=$(ls dist/Wikivault-Setup-*.exe | head -n 1)
          node _main/scripts/set-download-link.js "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$installer" _main
          cd _main
          if ! git diff --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -am "Point the download links at $RELEASE_TAG"
            git push origin HEAD:main
          fi
      # A release/<tag> branch has done its work once the release is up.
      - name: Remove the release branch
        if: startsWith(github.ref, 'refs/heads/release/')
        shell: bash
        run: git push origin --delete "${GITHUB_REF#refs/heads/}" || true
